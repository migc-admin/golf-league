      <h1>The simplest way to run a golf event</h1>
      <p>Set up in minutes — online registration, digital scorecards, live leaderboards, and payouts.</p>
      <p>Free to start. No credit card required. Payouts powered by your own Venmo or PayPal link. We don't sell your data.</p>

      <h2>What Scorify Golf does</h2>
      <ul>
        <li>Online registration — players sign up and pay through your own Venmo or PayPal link</li>
        <li>Group and tee sheet management — build groups, print tee sheets and cart signs</li>
        <li>Live digital scoring — players enter scores hole-by-hole on their phones</li>
        <li>Automatic leaderboards — standings update in real time, no spreadsheet needed</li>
        <li>Skins calculation — gross and net skins computed automatically</li>
        <li>Handicap tracking — USGA-adjusted scores and course handicap built in</li>
        <li>Payout management — track and distribute winnings at the end of every round</li>
        <li>Printable scorecards, cart signs, and side game sheets</li>
        <li>Team play and TGL points tracking across a full season</li>
      </ul>

      <h2>Who it's for</h2>
      <p>Golf league directors and organizers running weekly, monthly, or seasonal leagues — typically 10 to 60 players. If you have been managing your league in a spreadsheet or group chat, Scorify replaces all of it.</p>

      <h2>Pricing</h2>
      <p>Free to start. No per-player fees. No transaction fees. Paid plans available for larger leagues that want premium features. You are never charged to run a round.</p>

      <h2>Common questions</h2>
      <p><strong>Is free-to-start really free?</strong> Yes. You can run your entire league season without paying anything. No credit card required to sign up.</p>
      <p><strong>Are there per-player or transaction fees?</strong> No. Scorify does not process payments. You collect dues through your own Venmo or PayPal — we never touch the money.</p>
      <p><strong>Can I use my own scoring format — skins, flights, Stableford?</strong> Yes. Scorify supports gross and net skins, flight-based leaderboards, team play, and points-based season standings.</p>
      <p><strong>Is my course in the database?</strong> Scorify uses course data including par and stroke index for handicap calculations. If your course is not yet listed, you can enter the details manually.</p>

      <h2>What league organizers say</h2>
      <blockquote>"The post-round process is a breeze compared to manually checking scorecards."</blockquote>
      <blockquote>"The ability to enter scores during the round and keep track of the competition is a game changer!"</blockquote>
      <blockquote>"The online registration, payment, and organization has made the pre-tournament setup way more efficient."</blockquote>

      <h2>About Scorify Golf</h2>
      <p>Scorify was built by Kevin V, a business operations professional who ran golf leagues and got tired of being stuck at the scoring table after every round while everyone else socialized. Existing tools were either too complicated, too expensive, or built for golf facilities — not independent organizers. Scorify delivers an affordable, modern platform so any league director can run their league like a pro.</p>

      <p>Get started free at scorifygolf.com</p>
